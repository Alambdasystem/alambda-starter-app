workflows:
  android-release:
    name: Alambda Checklist - Android APK and AAB
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      node: 22
      java: 17
      android_signing:
        - alambda_checklist_upload
    scripts:
      - name: Install locked dependencies
        script: npm ci
      - name: Lint
        script: npx eslint .
      - name: Type check
        script: npx tsc --noEmit
      - name: Generate Android project
        script: npx expo prebuild --platform android --no-install
      - name: Configure release signing
        script: node configure-signing.cjs
      - name: Build signed APK and app bundle
        script: |
          cd android
          ./gradlew assembleRelease bundleRelease
      - name: Verify bundle signature
        script: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt
